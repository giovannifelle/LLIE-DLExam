experiment:
  name: baseline
  seed: 42

data:
  raw_dir: data/raw
  splits_dir: data/splits
  train_dataset: LOL-v2
  val_dataset: LOL-v2
  test_datasets:
    - LOL-v2
    - LOL-v1
    - ExDark

  image_size: 256
  batch_size: 8
  num_workers: 4
  val_fraction: 0.15
  exdark_samples_per_category: 10

model:
  name: UNet
  in_channels: 3
  out_channels: 3
  base_features: 32

training:
  epochs: 100
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.00001
  early_stopping_patience: 10
  mixed_precision: true

loss:
  l1_weight: 1.0
  ssim_weight: 0.2

augmentation:
  enabled: true
  crop_padding: 32
  horizontal_flip_probability: 0.5
  brightness: 0.0
  contrast: 0.0

evaluation:
  metrics:
    - PSNR
    - SSIM
    - NIQE
    - BRISQUE
