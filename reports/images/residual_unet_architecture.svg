<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #485166; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #172033; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #485166; }
      .box { stroke: #23324d; stroke-width: 2; rx: 8; ry: 8; }
      .encoder { fill: #d8ecff; }
      .bottleneck { fill: #fde4b7; }
      .decoder { fill: #dff3dc; }
      .output { fill: #eadff8; }
      .legend { fill: #f7f8fb; stroke: #c8cfdd; stroke-width: 1.5; rx: 8; ry: 8; }
      .arrow { stroke: #26344f; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .skip { stroke: #b25b00; stroke-width: 2.6; fill: none; stroke-dasharray: 7 6; marker-end: url(#skiphead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#26344f"/>
    </marker>
    <marker id="skiphead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b25b00"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="60" y="58" class="title">ResidualUNet Architecture</text>
  <text x="60" y="86" class="subtitle">UNet encoder-decoder with residual blocks replacing the baseline DoubleConv modules.</text>

  <text x="92" y="145" class="label">Input</text>
  <rect x="60" y="165" width="130" height="74" class="box output"/>
  <text x="88" y="197" class="label">Low RGB</text>
  <text x="86" y="220" class="small">3 x 256 x 256</text>

  <text x="303" y="145" class="label">Encoder</text>
  <rect x="250" y="165" width="155" height="74" class="box encoder"/>
  <text x="277" y="193" class="label">ResidualBlock</text>
  <text x="286" y="216" class="small">3 -> 32</text>

  <rect x="250" y="285" width="155" height="74" class="box encoder"/>
  <text x="278" y="313" class="label">MaxPool +</text>
  <text x="272" y="336" class="label">ResidualBlock</text>
  <text x="286" y="351" class="small">32 -> 64</text>

  <rect x="250" y="405" width="155" height="74" class="box encoder"/>
  <text x="278" y="433" class="label">MaxPool +</text>
  <text x="272" y="456" class="label">ResidualBlock</text>
  <text x="282" y="471" class="small">64 -> 128</text>

  <rect x="250" y="525" width="155" height="74" class="box encoder"/>
  <text x="278" y="553" class="label">MaxPool +</text>
  <text x="272" y="576" class="label">ResidualBlock</text>
  <text x="279" y="591" class="small">128 -> 256</text>

  <text x="548" y="615" class="label">Bottleneck</text>
  <rect x="500" y="645" width="170" height="60" class="box bottleneck"/>
  <text x="528" y="670" class="label">MaxPool +</text>
  <text x="522" y="693" class="label">ResidualBlock</text>

  <text x="861" y="145" class="label">Decoder</text>
  <rect x="785" y="525" width="180" height="74" class="box decoder"/>
  <text x="817" y="552" class="label">UpConv + Cat</text>
  <text x="818" y="575" class="label">ResidualBlock</text>
  <text x="827" y="590" class="small">512 + 256 -> 256</text>

  <rect x="785" y="405" width="180" height="74" class="box decoder"/>
  <text x="817" y="432" class="label">UpConv + Cat</text>
  <text x="818" y="455" class="label">ResidualBlock</text>
  <text x="827" y="470" class="small">256 + 128 -> 128</text>

  <rect x="785" y="285" width="180" height="74" class="box decoder"/>
  <text x="817" y="312" class="label">UpConv + Cat</text>
  <text x="818" y="335" class="label">ResidualBlock</text>
  <text x="833" y="350" class="small">128 + 64 -> 64</text>

  <rect x="785" y="165" width="180" height="74" class="box decoder"/>
  <text x="817" y="192" class="label">UpConv + Cat</text>
  <text x="818" y="215" class="label">ResidualBlock</text>
  <text x="836" y="230" class="small">64 + 32 -> 32</text>

  <text x="1110" y="145" class="label">Output</text>
  <rect x="1070" y="165" width="150" height="74" class="box output"/>
  <text x="1093" y="196" class="label">Conv 1x1</text>
  <text x="1096" y="219" class="small">32 -> 3</text>

  <rect x="1260" y="165" width="120" height="74" class="box output"/>
  <text x="1283" y="197" class="label">Sigmoid</text>
  <text x="1277" y="220" class="small">RGB [0, 1]</text>

  <path class="arrow" d="M190 202 H250"/>
  <path class="arrow" d="M328 239 V285"/>
  <path class="arrow" d="M328 359 V405"/>
  <path class="arrow" d="M328 479 V525"/>
  <path class="arrow" d="M405 562 C475 562 500 627 545 645"/>
  <path class="arrow" d="M670 675 C745 675 780 612 875 599"/>
  <path class="arrow" d="M875 525 V479"/>
  <path class="arrow" d="M875 405 V359"/>
  <path class="arrow" d="M875 285 V239"/>
  <path class="arrow" d="M965 202 H1070"/>
  <path class="arrow" d="M1220 202 H1260"/>

  <path class="skip" d="M405 202 C548 112 668 112 785 202"/>
  <path class="skip" d="M405 322 C540 255 666 255 785 322"/>
  <path class="skip" d="M405 442 C540 398 666 398 785 442"/>
  <path class="skip" d="M405 562 C540 562 666 562 785 562"/>

  <rect x="1015" y="525" width="310" height="92" class="legend"/>
  <text x="1035" y="555" class="label">Legend</text>
  <line x1="1038" y1="578" x2="1118" y2="578" class="arrow"/>
  <text x="1130" y="583" class="small">Forward path</text>
  <line x1="1038" y1="604" x2="1118" y2="604" class="skip"/>
  <text x="1130" y="609" class="small">Encoder-decoder skip concat</text>
</svg>
